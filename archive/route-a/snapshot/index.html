<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniCPM-o 4.5 — 远程算力 · 本地音视频</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f1117;
    color: #e8eaf0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 24px 16px;
  }
  h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 4px; }
  .subtitle { font-size: 0.8rem; color: #6b7280; margin-bottom: 24px; }
  .card {
    background: #1a1d27;
    border: 1px solid #2a2d3e;
    border-radius: 12px;
    padding: 20px;
    width: 100%;
    max-width: 680px;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; color: #6b7280; margin-bottom: 10px;
  }
  #cameraPreview {
    width: 100%; border-radius: 8px; background: #111;
    aspect-ratio: 4/3; display: block; object-fit: cover; transform: scaleX(-1);
  }
  #camStatus { font-size: 0.75rem; color: #6b7280; margin-top: 6px; }
  #statusBar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: 8px;
    background: #12151f; border: 1px solid #2a2d3e; margin-bottom: 16px;
    width: 100%; max-width: 680px;
  }
  #statusDot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #6b7280; flex-shrink: 0; transition: background 0.3s;
  }
  #statusDot.listening  { background: #22c55e; animation: pulse 1.5s infinite; }
  #statusDot.processing { background: #f59e0b; animation: pulse 0.7s infinite; }
  #statusDot.speaking   { background: #3b82f6; animation: pulse 1.0s infinite; }
  #statusDot.connecting { background: #a855f7; animation: pulse 1.0s infinite; }
  #statusDot.recording  { background: #ef4444; animation: pulse 0.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  #statusText { font-size: 0.85rem; color: #9ca3af; }
  #micNote { font-size: 0.75rem; color: #6b7280; margin-left: auto; }
  #transcript {
    min-height: 120px; max-height: 320px; overflow-y: auto;
    font-size: 0.9rem; line-height: 1.7; color: #d1d5db;
    white-space: pre-wrap; padding: 4px 2px;
  }
  #transcript .turn { margin-bottom: 12px; }
  #transcript .turn-label { font-size: 0.72rem; color: #6b7280; margin-bottom: 2px; }
  #transcript .turn-text  { color: #e5e7eb; }
  .controls { display: flex; gap: 12px; justify-content: center; }
  button {
    padding: 10px 28px; border-radius: 8px; border: none;
    font-size: 0.9rem; font-weight: 500; cursor: pointer;
    transition: opacity 0.2s, background 0.2s;
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #btnStart { background: #2563eb; color: #fff; }
  #btnStart:hover:not(:disabled) { background: #1d4ed8; }
  #btnStop  { background: #374151; color: #e5e7eb; }
  #btnStop:hover:not(:disabled)  { background: #4b5563; }
  .mode-selector {
    display: flex; gap: 8px; margin-bottom: 16px;
    width: 100%; max-width: 680px;
  }
  .mode-btn {
    flex: 1; padding: 8px 0; border-radius: 8px; border: 1px solid #2a2d3e;
    background: #1a1d27; color: #9ca3af; font-size: 0.82rem;
    font-weight: 500; cursor: pointer; transition: all 0.2s;
  }
  .mode-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
  .mode-btn:hover:not(.active) { background: #252836; }
  #pttHint {
    font-size: 0.78rem; color: #6b7280; text-align: center;
    margin-top: 8px; min-height: 1.2em;
  }
  .toggle-row {
    display: flex; gap: 14px; align-items: center; font-size: 0.78rem;
    color: #9ca3af; margin-top: 8px;
  }
  .toggle-row label { cursor: pointer; user-select: none; }
</style>
</head>
<body>

<h1>MiniCPM-o 4.5</h1>
<p class="subtitle">远程算力（spark）· 本地麦克风/摄像头/扬声器</p>

<div class="card">
  <div class="card-title">本地摄像头预览</div>
  <video id="cameraPreview" autoplay muted playsinline></video>
  <p id="camStatus">点击「开始对话」请求摄像头权限…</p>
  <div class="toggle-row">
    <label><input type="checkbox" id="enableVideo" checked> 启用摄像头（视觉问答）</label>
  </div>
</div>

<div id="statusBar">
  <div id="statusDot" class="connecting"></div>
  <span id="statusText">连接服务器中…</span>
  <span id="micNote">🎙 本地麦克风</span>
</div>

<div class="card">
  <div class="card-title">对话记录</div>
  <div id="transcript"><span style="color:#4b5563;font-size:0.8rem">回复将显示在这里…</span></div>
</div>

<div class="mode-selector">
  <button class="mode-btn active" id="modeVad">🎙 VAD 自动检测</button>
  <button class="mode-btn"        id="modePtt">⌨️ 空格键说话</button>
</div>

<div class="controls">
  <button id="btnStart" disabled>开始对话</button>
  <button id="btnStop"  disabled>停止</button>
</div>
<p id="pttHint"></p>

<script>
// ─── 配置 ────────────────────────────────────────────────────────────────────
const WS_URL   = `${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`;
const TTS_RATE = 24000;          // 服务端 TTS PCM 采样率
const MIC_RATE = 16000;          // 上传给服务端的目标采样率
const VIDEO_FPS = 1;             // 摄像头帧上传频率
const VIDEO_W = 320, VIDEO_H = 240, VIDEO_QUALITY = 0.6;

const TYPE_PCM     = 0x01;
const TYPE_JPEG    = 0x02;
const TYPE_CTRL    = 0x03;
const TYPE_TTS     = 0x10;

// ─── 状态 ────────────────────────────────────────────────────────────────────
let ws = null;
let micCtx = null, micSource = null, micWorklet = null, micStream = null;
let ttsCtx = null;
let ttsScheduledUntil = 0;
let currentTurnEl = null, currentTurnText = '';
let currentMode = 'vad';
let pttActive = false;
let sessionOn = false;
let videoStream = null, videoEl = null, videoTimer = null, videoCanvas = null;

const previewEl  = document.getElementById('cameraPreview');
const camStatus  = document.getElementById('camStatus');
const statusDot  = document.getElementById('statusDot');
const statusTxt  = document.getElementById('statusText');
const transcript = document.getElementById('transcript');
const btnStart   = document.getElementById('btnStart');
const btnStop    = document.getElementById('btnStop');
const modeVad    = document.getElementById('modeVad');
const modePtt    = document.getElementById('modePtt');
const pttHint    = document.getElementById('pttHint');
const enableVideoCb = document.getElementById('enableVideo');

videoEl = previewEl;

// ─── UI 工具 ─────────────────────────────────────────────────────────────────
function setStatus(cls, label) {
  statusDot.className = cls;
  statusTxt.textContent = label;
}

function appendTranscript(text) {
  const ph = transcript.querySelector('span');
  if (ph) ph.remove();
  if (!currentTurnEl) {
    const turn = document.createElement('div');
    turn.className = 'turn';
    const lbl = document.createElement('div');
    lbl.className = 'turn-label';
    lbl.textContent = 'AI 助手';
    const txt = document.createElement('div');
    txt.className = 'turn-text';
    turn.appendChild(lbl);
    turn.appendChild(txt);
    transcript.appendChild(turn);
    currentTurnEl = txt;
    currentTurnText = '';
  }
  currentTurnText += text;
  currentTurnEl.textContent = currentTurnText;
  transcript.scrollTop = transcript.scrollHeight;
}

// ─── WebSocket ───────────────────────────────────────────────────────────────
function connectWS() {
  setStatus('connecting', '连接服务器中…');
  ws = new WebSocket(WS_URL);
  ws.binaryType = 'arraybuffer';

  ws.onopen  = () => setStatus('connecting', '已连接，等待模型加载…');
  ws.onclose = () => {
    setStatus('', '连接断开，请刷新页面重连');
    btnStart.disabled = btnStop.disabled = true;
    stopSession();
  };
  ws.onerror = () => setStatus('', 'WebSocket 错误，请检查 SSH 隧道');

  ws.onmessage = (ev) => {
    if (ev.data instanceof ArrayBuffer) {
      handleBinary(ev.data);
    } else {
      try { handleJson(JSON.parse(ev.data)); } catch(e){}
    }
  };
}

function handleJson(msg) {
  if (msg.type === 'ready') {
    setStatus('listening', '已就绪 — 点击「开始对话」');
    btnStart.disabled = false;
  } else if (msg.type === 'status') {
    const labels = {
      listening:'监听中…', processing:'处理中…',
      speaking:'正在说话…', idle:'已停止',
      recording:'🔴 录音中…按空格停止',
    };
    setStatus(msg.state, labels[msg.state] || msg.state);
    if (msg.state === 'processing') { currentTurnEl = null; currentTurnText = ''; }
  } else if (msg.type === 'text') {
    appendTranscript(msg.data);
  }
}

let _ttsBytesIn = 0, _ttsChunksIn = 0;
function handleBinary(buf) {
  const view = new Uint8Array(buf);
  const msgType = view[0];
  if (msgType === TYPE_TTS && ttsCtx) {
    if (ttsCtx.state === 'suspended') {
      ttsCtx.resume().catch(()=>{});
    }
    // f32 数据可能不是 4 字节对齐（前面 1 字节 type），需要 copy 到对齐 buffer
    const raw = new Uint8Array(buf, 1);
    const aligned = new ArrayBuffer(raw.byteLength);
    new Uint8Array(aligned).set(raw);
    const f32 = new Float32Array(aligned);
    _ttsBytesIn += raw.byteLength; _ttsChunksIn++;
    if (_ttsChunksIn % 10 === 1) {
      console.log('[TTS] received chunks=' + _ttsChunksIn + ' bytes=' + _ttsBytesIn + ' state=' + ttsCtx.state);
    }
    const ab  = ttsCtx.createBuffer(1, f32.length, TTS_RATE);
    ab.copyToChannel(f32, 0);
    const src = ttsCtx.createBufferSource();
    src.buffer = ab;
    src.connect(ttsCtx.destination);
    const now = ttsCtx.currentTime;
    const at  = Math.max(now + 0.02, ttsScheduledUntil);
    src.start(at);
    ttsScheduledUntil = at + ab.duration;
  }
}

// ─── 模式切换 ─────────────────────────────────────────────────────────────────
function setMode(mode) {
  currentMode = mode;
  modeVad.classList.toggle('active', mode === 'vad');
  modePtt.classList.toggle('active', mode === 'ptt');
  pttHint.textContent = mode === 'ptt'
    ? '会话开始后：按空格开始录音，再按空格发送'
    : '';
  sendCtrl('set_mode', { mode });
}
modeVad.addEventListener('click', () => setMode('vad'));
modePtt.addEventListener('click', () => setMode('ptt'));

// ─── 空格键 PTT ───────────────────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if ((e.code !== 'Space' && e.key !== ' ') || e.repeat) return;
  e.preventDefault();
  if (document.activeElement && document.activeElement.tagName === 'BUTTON') {
    document.activeElement.blur();
  }
  if (currentMode !== 'ptt') return;
  if (!sessionOn) return;
  if (!pttActive) {
    pttActive = true;
    pttHint.textContent = '🔴 录音中… 再按空格发送';
    sendCtrl('ptt_start');
  } else {
    pttActive = false;
    pttHint.textContent = '⏳ 处理中…';
    sendCtrl('ptt_stop');
  }
});

// ─── 麦克风采集（AudioWorklet 16kHz float32 → WS 0x01） ───────────────────────
const WORKLET_CODE = `
class PCMUploader extends AudioWorkletProcessor {
  constructor(opts) {
    super();
    this.targetRate = opts.processorOptions.targetRate;
    this.srcRate    = sampleRate;
    this.ratio      = this.srcRate / this.targetRate;
    this.frame      = 320;            // 20ms @16k
    this.outBuf     = new Float32Array(this.frame);
    this.outIdx     = 0;
    this.srcAcc     = 0.0;
  }
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (!ch) return true;
    // 简单线性插值降采样到 targetRate（48k→16k 比例 3:1，质量足够 ASR）
    for (let i = 0; i < ch.length; i++) {
      this.srcAcc += 1;
      if (this.srcAcc >= this.ratio) {
        this.srcAcc -= this.ratio;
        this.outBuf[this.outIdx++] = ch[i];
        if (this.outIdx >= this.frame) {
          this.port.postMessage(this.outBuf.slice(0));
          this.outIdx = 0;
        }
      }
    }
    return true;
  }
}
registerProcessor('pcm-uploader', PCMUploader);
`;

async function startMic() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
  } catch (err) {
    alert('麦克风权限被拒绝：' + err.message);
    throw err;
  }
  micCtx = new (window.AudioContext || window.webkitAudioContext)();
  const blob = new Blob([WORKLET_CODE], { type: 'application/javascript' });
  const blobUrl = URL.createObjectURL(blob);
  await micCtx.audioWorklet.addModule(blobUrl);
  micSource = micCtx.createMediaStreamSource(micStream);
  micWorklet = new AudioWorkletNode(micCtx, 'pcm-uploader', {
    processorOptions: { targetRate: MIC_RATE },
  });
  micWorklet.port.onmessage = (ev) => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const f32 = ev.data;
    const buf = new Uint8Array(1 + f32.byteLength);
    buf[0] = TYPE_PCM;
    buf.set(new Uint8Array(f32.buffer), 1);
    ws.send(buf.buffer);
  };
  micSource.connect(micWorklet);
  // 不连 destination —— 不本地回放
}

function stopMic() {
  try { micWorklet && micWorklet.disconnect(); } catch(e){}
  try { micSource  && micSource.disconnect(); } catch(e){}
  try { micCtx     && micCtx.close(); } catch(e){}
  try { micStream && micStream.getTracks().forEach(t => t.stop()); } catch(e){}
  micCtx = micSource = micWorklet = micStream = null;
}

// ─── 摄像头采集（每秒 1 帧 JPEG → WS 0x02） ──────────────────────────────────
async function startVideo() {
  if (!enableVideoCb.checked) {
    camStatus.textContent = '已禁用摄像头';
    return;
  }
  try {
    videoStream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 640 }, height: { ideal: 480 } },
    });
  } catch (err) {
    camStatus.textContent = '摄像头权限被拒绝：' + err.message;
    return;
  }
  videoEl.srcObject = videoStream;
  videoCanvas = document.createElement('canvas');
  videoCanvas.width = VIDEO_W; videoCanvas.height = VIDEO_H;
  const ctx = videoCanvas.getContext('2d');

  videoTimer = setInterval(() => {
    if (!videoEl.videoWidth || !ws || ws.readyState !== WebSocket.OPEN) return;
    ctx.drawImage(videoEl, 0, 0, VIDEO_W, VIDEO_H);
    videoCanvas.toBlob((blob) => {
      if (!blob) return;
      blob.arrayBuffer().then((ab) => {
        const u8 = new Uint8Array(1 + ab.byteLength);
        u8[0] = TYPE_JPEG;
        u8.set(new Uint8Array(ab), 1);
        ws.send(u8.buffer);
      });
    }, 'image/jpeg', VIDEO_QUALITY);
  }, 1000 / VIDEO_FPS);
  camStatus.textContent = '本地摄像头采集中（' + VIDEO_FPS + ' FPS → spark）';
}

function stopVideo() {
  if (videoTimer) { clearInterval(videoTimer); videoTimer = null; }
  if (videoStream) { videoStream.getTracks().forEach(t => t.stop()); videoStream = null; }
  videoEl.srcObject = null;
  camStatus.textContent = '已停止';
}

// ─── 开始 / 停止会话 ──────────────────────────────────────────────────────────
async function startSession() {
  btnStart.disabled = true;

  // TTS 播放上下文（24kHz）。指定 sampleRate 在某些浏览器/系统组合下会失败，
  // 失败时回退到默认采样率，AudioBuffer 会自动重采样。
  try {
    ttsCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: TTS_RATE });
  } catch (e) {
    console.warn('[TTS] 24kHz AudioContext 失败，回退默认采样率:', e);
    ttsCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  // 关键：用户手势内显式 resume，规避 autoplay policy
  try { await ttsCtx.resume(); } catch(e) {}
  console.log('[TTS] AudioContext sampleRate=' + ttsCtx.sampleRate + ' state=' + ttsCtx.state);
  ttsScheduledUntil = 0;
  _ttsBytesIn = 0; _ttsChunksIn = 0;

  try {
    await startMic();
  } catch (e) {
    btnStart.disabled = false;
    return;
  }
  await startVideo();

  btnStop.disabled = false;
  sessionOn = true;
  pttActive = false;

  sendCtrl('start');
  sendCtrl('set_mode', { mode: currentMode });
  if (currentMode === 'ptt') pttHint.textContent = '按空格开始录音，再按空格发送';
}

function stopSession() {
  if (pttActive) { pttActive = false; sendCtrl('ptt_stop'); }
  sendCtrl('stop');
  stopMic();
  stopVideo();
  if (ttsCtx) { ttsCtx.close(); ttsCtx = null; }
  sessionOn = false;
  btnStart.disabled = false;
  btnStop.disabled  = true;
  setStatus('listening', '已停止，点击「开始对话」重新开始');
}

function sendCtrl(action, extra) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const obj = extra ? { action, ...extra } : { action };
  const payload = JSON.stringify(obj);
  const encoded = new TextEncoder().encode(payload);
  const buf = new Uint8Array(1 + encoded.length);
  buf[0] = TYPE_CTRL;
  buf.set(encoded, 1);
  ws.send(buf.buffer);
}

btnStart.addEventListener('click', startSession);
btnStop.addEventListener('click',  stopSession);
connectWS();
</script>
</body>
</html>
